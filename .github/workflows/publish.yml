name: publish

# Tag-triggered release (#42): on a `vX.Y.Z` tag, build + lint + test, prepare
# a draft GitHub Release from the matching CHANGELOG section, publish to npm
# with provenance via npm Trusted Publishing (OIDC), then publish the GitHub Release.
#
# Auth is npm Trusted Publishing (#63): no stored `NPM_TOKEN`. PREREQUISITE - a
# one-time npmjs.com config: the `prowl-review` package must list this repository
# and `publish.yml` as its GitHub Actions trusted publisher (npmjs.com -> package ->
# Settings -> Trusted Publishing) with the allowed action `npm publish` selected.
# Selecting only `npm stage publish` does not authorize this workflow's direct
# `npm publish` command. Until that config exists the `npm publish` step fails the
# run (safely re-runnable once configured). There is deliberately NO token fallback
# - removing token dependence is the point of #63.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write   # npm publish --provenance (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write   # create and publish the GitHub Release
      pull-requests: write
      checks: write
      id-token: write   # npm publish --provenance (OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js 22.14
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm 11.5.0 introduced OIDC publishing support; npm 11.5.1 is the minimum
      # compatible version. Node 22.14 bundles npm 10, so upgrade before publishing.
      - name: Upgrade npm to a Trusted Publishing-capable version
        env:
          MIN_NPM_VERSION: 11.5.1
        run: |
          npm install -g "npm@${MIN_NPM_VERSION}"
          actual_npm="$(npm --version)"
          if [ "${actual_npm}" != "${MIN_NPM_VERSION}" ]; then
            echo "::error::npm upgrade failed or incomplete; got ${actual_npm}, need ${MIN_NPM_VERSION}." >&2
            exit 1
          fi

      - run: npm ci

      - name: Verify tag matches package.json version
        id: version
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be stable SemVer in the form vX.Y.Z; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if ! pkg_version="$(node -p "require('./package.json').version" 2>/dev/null)"; then
            echo "::error::Failed to read version from package.json." >&2
            exit 1
          fi
          if [ -z "${pkg_version}" ] || [ "${pkg_version}" = "undefined" ]; then
            echo "::error::package.json must define a version." >&2
            exit 1
          fi
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag_version}) does not match package.json version ${pkg_version}." >&2
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify versioned changelog section exists
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -F "## [${RELEASE_VERSION}]" CHANGELOG.md >/dev/null; then
            echo "::error::CHANGELOG.md must contain ## [${RELEASE_VERSION}] before publishing." >&2
            exit 1
          fi

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-section.mjs "${RELEASE_VERSION}" > RELEASE_NOTES.md

      - name: Prepare draft GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_view_error="$(mktemp)"
          trap 'rm -f "${release_view_error}"' EXIT
          if draft_status="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --template '{{.isDraft}}' 2>"${release_view_error}")"; then
            if [ "${draft_status}" = "true" ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --notes-file RELEASE_NOTES.md \
                --draft
            fi
            echo "draft=${draft_status}" >> "$GITHUB_OUTPUT"
          else
            if ! grep -Eiq "(not found|404)" "${release_view_error}"; then
              cat "${release_view_error}" >&2
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              --verify-tag
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether version is already published
        id: npm-status
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! pkg_name="$(node -p "require('./package.json').name" 2>/dev/null)"; then
            echo "::error::Failed to read package name from package.json." >&2
            exit 1
          fi
          if [ -z "${pkg_name}" ] || [ "${pkg_name}" = "undefined" ]; then
            echo "::error::package.json must define a package name." >&2
            exit 1
          fi
          if npm view "${pkg_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate npm Trusted Publishing prerequisites
        if: steps.npm-status.outputs.already_published != 'true'
        env:
          MIN_NPM_VERSION: 11.5.1
        run: |
          actual_npm="$(npm --version)"
          if [ "${actual_npm}" != "${MIN_NPM_VERSION}" ]; then
            echo "::error::npm ${actual_npm} does not support Trusted Publishing; need ${MIN_NPM_VERSION}." >&2
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN must not be set for Trusted Publishing releases." >&2
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC request environment is unavailable; ensure id-token: write is set on the publish job." >&2
            exit 1
          fi

      # Publishes via npm Trusted Publishing (OIDC) using the `id-token: write`
      # permission - no NODE_AUTH_TOKEN. Requires the npmjs.com trusted-publisher
      # config (see header); without it the OIDC exchange fails and the run stops
      # here. Re-run after configuring; no token fallback by design (#63).
      - name: Publish to npm
        if: steps.npm-status.outputs.already_published != 'true'
        run: |
          if ! npm publish --provenance --access public; then
            echo "::error::npm Trusted Publishing failed. Confirm the npmjs.com trusted publisher for prowl-review is configured for repo prowl-tools/prowl-code-review, workflow publish.yml, and allowed action npm publish." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.github-release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
