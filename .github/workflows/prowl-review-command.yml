# prowl-review command (@prowl-review chat commands + questions on PRs, #26/#27).
name: prowl-review command

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Serialize commands with auto reviews for the same PR so review publishing and
# inline finding dedupe cannot race. Shares the per-PR Codex group name with the
# auto-review workflow (#64) so the two serialize together; machine-wide
# serialization across repos/runner instances is the provider's Codex lock, not
# GitHub concurrency. cancel-in-progress stays false in both workflows so an
# in-flight maintainer request is never cancelled by a newer auto-review push.
# The PR number comes from `issue` (issue_comment) or `pull_request`
# (pull_request_review_comment).
concurrency:
  group: prowl-review-codex-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: read

jobs:
  resolve:
    # Only PR comments (top-level or inline) that mention the bot; never plain
    # issue comments or bot comments. This ubuntu job (no provider secrets) does
    # the fork/trust resolution so the self-hosted Codex runner below is only ever
    # scheduled for an authorized, same-repo request.
    if: |
      (github.event.issue.pull_request || github.event.pull_request) &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      contains(github.event.comment.body, '@prowl-review') &&
      !contains(github.event.comment.body, '<!-- prowl-review:summary -->') &&
      !contains(github.event.comment.body, '<!-- prowl-review:finding ')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      trusted_head: ${{ steps.pr.outputs.trusted_head }}
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number || github.event.pull_request.number }}"
          IFS=$'\t' read -r base_sha head_sha head_repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.sha, .head.sha, .head.repo.full_name] | @tsv'
          )
          if [ -z "${base_sha}" ] || [ -z "${head_sha}" ] || [ -z "${head_repo}" ]; then
            echo "Failed to resolve complete PR metadata for #${pr_number}." >&2
            exit 1
          fi
          {
            echo "pr_number=${pr_number}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "head_repo=${head_repo}"
          } >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "trusted_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_head=false" >> "$GITHUB_OUTPUT"
            echo "Skipping command from fork PR head ${head_repo}; the self-hosted Codex runner is never scheduled for fork code."
          fi

  command:
    needs: resolve
    # Job-level same-repo gate (#64): the self-hosted Codex runner must NEVER be
    # scheduled for a fork PR. trusted_head is the same-repo verdict re-derived
    # from server-side PR metadata; the explicit head_repo == github.repository
    # check is belt-and-suspenders alongside it.
    if: >
      needs.resolve.outputs.trusted_head == 'true' &&
      needs.resolve.outputs.head_repo == github.repository
    # Keyless `provider: codex` runs on the always-on Mac mini (#64).
    runs-on: [self-hosted, macOS, prowl-review]
    timeout-minutes: 30
    env:
      PROWL_APP_CONFIGURED: ${{ secrets.PROWL_APP_ID != '' && secrets.PROWL_APP_PRIVATE_KEY != '' }}
    steps:
      # Branded identity (#59): mint an App installation token when PROWL_APP_ID
      # is set so the command reply posts as prowl-review[bot] with the App
      # avatar. The env flag is only a boolean; the private key is only handed
      # to the token action. Falls back to github-actions[bot].
      - name: Mint prowl-review app token
        id: app-token
        if: env.PROWL_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - name: Checkout trusted base (config + guidelines)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: prowl-base
          persist-credentials: false

      - name: Check trusted action availability
        id: trusted-action
        shell: bash
        run: |
          # Require the base action to support command mode AND the keyless Codex
          # provider (#45/#64, the ai-provider input) before running, so the
          # self-hosted trigger never drives an old base action that lacks
          # `provider: codex`. Self-bootstraps once this PR merges to the base.
          action_file=""
          if [ -f prowl-base/action.yml ]; then
            action_file="prowl-base/action.yml"
          elif [ -f prowl-base/action.yaml ]; then
            action_file="prowl-base/action.yaml"
          fi

          if [ -n "${action_file}" ] &&
            grep -Eq '^[[:space:]]{2}mode:' "${action_file}" &&
            grep -q 'inputs.mode' "${action_file}" &&
            grep -q 'ai-provider' "${action_file}" &&
            grep -q 'codex' "${action_file}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Trusted base does not support the prowl-review command-mode Codex provider yet; skipping command run."
          fi

      - name: Checkout PR head for context
        if: steps.trusted-action.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr-head
          persist-credentials: false

      - name: prowl-review command
        if: steps.trusted-action.outputs.available == 'true'
        uses: ./prowl-base # external repos use: prowl-tools/prowl-code-review@v1
        env:
          PROWL_REVIEWED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PROWL_REVIEWED_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repo }}
        with:
          mode: command
          # Keyless Codex subscription provider (#45/#64): no PROWL_AI_KEY_* secret
          # reaches this self-hosted job. Model + effort are pinned in the trusted
          # base-branch config; ai-provider is passed explicitly so an @prowl-review
          # command runs on the same keyless provider as the auto review.
          ai-provider: codex
          config-path: ${{ github.workspace }}/prowl-base/.prowl-review.yml
          workspace-path: ${{ github.workspace }}/pr-head
          guidelines-path: ${{ github.workspace }}/prowl-base
          # Branded App token when configured; otherwise the default Actions token.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          bot-login: ${{ steps.app-token.outputs.app-slug != '' && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
