name: CI

on:
  push:
    branches: [main]
  # Auto-review chains off this workflow via `workflow_run` (#61). `workflow_run`
  # does not preserve the original pull_request action, so CI must itself subscribe
  # to every transition that should trigger a review — opened, synchronize (new
  # pushes), ready_for_review (draft → ready), and reopened — or that review would
  # never fire.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

permissions:
  pull-requests: write
  checks: write
  contents: read

# Cancel superseded runs on rapid re-pushes to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
