# Caller for the reusable auto-review workflow (#37).
# Copy to .github/workflows/prowl-review.yml in EACH repo that should be reviewed.
# This is the whole per-repo file — the heavy lifting lives in the org workflow.
name: prowl-review

# Single branded checks row (#61): trigger off your CI workflow COMPLETING, not
# `pull_request`, so this auto-review adds NO row to the PR checks list — the
# branded "Prowl Review" check run is the only prowl-review presence on the PR.
#
# Set `workflows:` to the NAME of your repo's CI workflow (the `name:` in its YAML).
# That CI workflow MUST itself subscribe to the PR transitions that should trigger a
# review — `workflow_run` does not preserve the original pull_request action:
#   on:
#     pull_request:
#       types: [opened, synchronize, ready_for_review, reopened]
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# A reusable workflow's token scopes are capped by the caller, so grant them here.
permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: read
  actions: read # read the completed CI run for the PR-resolution fallback (#61)

jobs:
  review:
    # Point at your org's `.github` repo; pin a version (e.g. @v1).
    uses: Prowl-qa/.github/.github/workflows/prowl-review.yml@v1
    secrets: inherit
    with:
      # workflow_run hides this workflow's Actions row, so keep the branded
      # replacement check visible unless another required status owns the gate.
      check-run: true
    #   min-severity: major
    #   ai-provider: anthropic
    #   org-guidelines-path: https://example.com/review-guidelines.md
