# Reusable prowl-review auto-review workflow (#37).
#
# Install this ONCE in your org's `.github` repository as
#   .github/workflows/prowl-review.yml
# then every repo in the org calls it in a few lines — see
# `caller-prowl-review.yml`. No per-repo YAML copy-paste.
#
# Single branded checks row (#61): the caller triggers this off its CI workflow
# COMPLETING (`workflow_run`), not `pull_request`, so the auto-review adds no row
# to the PR checks list — the branded "Prowl Review" check run is the only
# prowl-review presence on the PR. This reusable workflow resolves the PR from the
# `workflow_run` payload and hands the number to the action.
#
# Pin a version when calling it (e.g. @v1) so a repo opts into upgrades.
name: prowl-review (reusable)

on:
  workflow_call:
    inputs:
      ai-provider:
        description: "LLM provider override: anthropic | openai | gemini. Blank = CLI default / ensemble."
        type: string
        required: false
        default: ""
      ai-model:
        description: "Model override (per-provider default otherwise)."
        type: string
        required: false
        default: ""
      min-severity:
        description: "Drop findings below this severity (critical|major|minor|trivial|info)."
        type: string
        required: false
        default: ""
      config-path:
        description: >
          Trusted .prowl-review.yml path, relative to the workspace. The base branch is
          checked out at `prowl-base/`, so set e.g. `prowl-base/.prowl-review.yml` to use
          your committed config. Blank ignores repo config (recommended default).
        type: string
        required: false
        default: ""
      check-run:
        description: >
          Publish the branded Prowl Review check run. Default true because workflow_run hides
          the Actions workflow row; set false if another required status owns the gate.
        type: boolean
        required: false
        default: true
      org-guidelines-path:
        description: "Path to an org-wide guidelines file or an http(s) URL, injected into every review (#30)."
        type: string
        required: false
        default: ""
      org-guidelines-workspace:
        description: "Trusted root used to validate org-guidelines-path file paths; defaults to the Actions workspace."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label(s) for the job."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      # BYOK: provide the key(s) your provider/ensemble needs. With `secrets: inherit`
      # in the caller, these flow through automatically.
      PROWL_AI_KEY:
        description: "Generic provider key fallback (single-provider setups)."
        required: false
      PROWL_AI_KEY_ANTHROPIC:
        required: false
      PROWL_AI_KEY_OPENAI:
        required: false
      PROWL_AI_KEY_GEMINI:
        required: false
      # Optional branded identity (#59): set both to post as your <app-slug>[bot]
      # with a custom avatar. When unset, posts as github-actions[bot].
      PROWL_APP_ID:
        required: false
      PROWL_APP_PRIVATE_KEY:
        required: false

# Token scopes the review needs. A reusable workflow's permissions are capped by
# the caller, so the caller must also grant these (the caller example does).
permissions:
  pull-requests: write   # post the review + inline comments
  issues: write          # create/update the summary comment (+ repo-wide learnings, #30)
  checks: write          # the branded merge-gate check run (the only PR row, #61)
  contents: read
  actions: read          # read the completed CI run for the PR-resolution fallback (#61)

jobs:
  resolve:
    # Only same-repo pull_request CI runs that SUCCEEDED start a review (#61).
    # `workflow_run` does not preserve the original PR action, so gate on the
    # triggering event type first (skip push CI), then require a green CI run.
    # Failure/cancelled/timed_out/skipped/etc. never start a review.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ inputs.runs-on }}
    outputs:
      resolved: ${{ steps.pr.outputs.resolved }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      is_draft: ${{ steps.pr.outputs.is_draft }}
      check_head_sha: ${{ steps.pr.outputs.check_head_sha }}
      check_conclusion: ${{ steps.pr.outputs.check_conclusion }}
      check_title: ${{ steps.pr.outputs.check_title }}
      check_summary: ${{ steps.pr.outputs.check_summary }}
    steps:
      - name: Resolve PR from the CI run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Payload PR list first; API fallback needs the run id + head SHA. Passed
          # via env (never inlined) so nothing from the event reaches the shell.
          PR_PAYLOAD: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECK_RUN: ${{ inputs.check-run }}
        shell: bash
        run: |
          set -euo pipefail

          report_check() {
            local conclusion="$1"
            local title="$2"
            local summary="$3"
            {
              echo "resolved=false"
              echo "head_sha=${HEAD_SHA}"
              echo "check_head_sha=${HEAD_SHA}"
              if [ -n "${pr_number:-}" ]; then
                echo "pr_number=${pr_number}"
              fi
              if [ "${CHECK_RUN}" = "true" ]; then
                echo "check_conclusion=${conclusion}"
                echo "check_title=${title}"
                echo "check_summary=${summary}"
              fi
            } >> "$GITHUB_OUTPUT"
          }

          # PR resolution (#61): merge workflow_run payload candidates with the
          # completed-run API lookup. Payloads can be present but incomplete, so the
          # API is not only an empty-payload fallback. Then keep only OPEN PRs whose
          # head SHA matches this CI run, and require EXACTLY ONE — never start a
          # review on a missing or ambiguous match.
          payload_candidates="$(printf '%s' "${PR_PAYLOAD}" | jq -r '.[]?.number // empty')"
          if ! api_candidates="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[]?.number')"; then
            report_check "failure" "Review setup failed" "prowl-review could not inspect the completed CI run while resolving a pull request. Inspect this workflow run for API, rate-limit, or permissions errors."
            echo "Skipping: failed to inspect completed CI run ${RUN_ID}."
            exit 0
          fi
          candidates="${payload_candidates}${payload_candidates:+ }${api_candidates}"

          matches=""
          for pr in ${candidates}; do
            if ! info="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '[.state, .head.sha] | @tsv' 2>/dev/null)"; then
              pr_number="${pr}"
              report_check "failure" "Review setup failed" "prowl-review could not load pull request #${pr} while resolving the completed CI run. Inspect this workflow run for API, rate-limit, or permissions errors."
              echo "Skipping: failed to load PR #${pr} metadata during resolution."
              exit 0
            fi
            state="$(printf '%s' "${info}" | cut -f1)"
            pr_head="$(printf '%s' "${info}" | cut -f2)"
            if [ "${state}" = "open" ] && [ "${pr_head}" = "${HEAD_SHA}" ]; then
              case " ${matches} " in
                *" ${pr} "*) ;;
                *) matches="${matches}${matches:+ }${pr}" ;;
              esac
            fi
          done

          set -- ${matches}
          count=$#
          if [ "${count}" -ne 1 ]; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: expected exactly one open PR at CI head ${HEAD_SHA}, found ${count} (${matches:-none})."
            exit 0
          fi
          pr_number="$1"

          # Re-derive trusted base/head from the resolved PR (never from the CI
          # payload) so the config/guidelines checkout stays anchored to base code.
          if ! meta="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.sha, .head.sha, .head.repo.full_name, .draft] | @tsv' 2>/dev/null)"; then
            report_check "failure" "Review setup failed" "prowl-review could not load pull request #${pr_number} metadata after resolving the completed CI run. Inspect this workflow run for API, rate-limit, or permissions errors."
            echo "Skipping: failed to load complete PR metadata for #${pr_number}."
            exit 0
          fi
          base_sha="$(printf '%s' "${meta}" | cut -f1)"
          head_sha="$(printf '%s' "${meta}" | cut -f2)"
          head_repo="$(printf '%s' "${meta}" | cut -f3)"
          is_draft="$(printf '%s' "${meta}" | cut -f4)"
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "null" ] ||
            [ -z "${head_sha}" ] || [ "${head_sha}" = "null" ] ||
            [ -z "${head_repo}" ] || [ "${head_repo}" = "null" ]; then
            report_check "failure" "Review setup failed" "prowl-review could not resolve complete metadata for pull request #${pr_number}. Inspect this workflow run for API, rate-limit, or permissions errors."
            echo "Skipping: incomplete PR metadata for #${pr_number}."
            exit 0
          fi
          if [ "${head_sha}" != "${HEAD_SHA}" ]; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR #${pr_number} head moved from CI head ${HEAD_SHA} to ${head_sha}."
            exit 0
          fi

          # Fork gate: forks never receive provider secrets. Draft handling is
          # deferred to the action so trusted `review.reviewDrafts` config and the
          # neutral skip check run still apply.
          if [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
            report_check "neutral" "Fork pull request - review skipped" "prowl-review skipped this fork pull request because provider secrets are unavailable to fork pull_request runs. No review was run for this commit."
            echo "Skipping fork PR head ${head_repo}; forks do not receive provider secrets."
            exit 0
          fi

          {
            echo "resolved=true"
            echo "pr_number=${pr_number}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "head_repo=${head_repo}"
            echo "is_draft=${is_draft}"
          } >> "$GITHUB_OUTPUT"

  report-unreviewable:
    needs: resolve
    if: needs.resolve.outputs.check_conclusion != ''
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      group: prowl-review-${{ needs.resolve.outputs.pr_number || needs.resolve.outputs.check_head_sha }}
      cancel-in-progress: false
    steps:
      - name: Detect branded app config
        id: brand
        shell: bash
        env:
          APP_ID: ${{ secrets.PROWL_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint prowl-review app token
        id: app-token
        if: steps.brand.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - name: Publish Prowl Review setup result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.check_head_sha }}
          CHECK_CONCLUSION: ${{ needs.resolve.outputs.check_conclusion }}
          CHECK_TITLE: ${{ needs.resolve.outputs.check_title }}
          CHECK_SUMMARY: ${{ needs.resolve.outputs.check_summary }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEAD_SHA}" ] || [ -z "${CHECK_CONCLUSION}" ]; then
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            --method POST \
            -f "name=Prowl Review" \
            -f "head_sha=${HEAD_SHA}" \
            -f "status=completed" \
            -f "conclusion=${CHECK_CONCLUSION}" \
            -f "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f "output[title]=${CHECK_TITLE}" \
            -f "output[summary]=${CHECK_SUMMARY}" \
            >/dev/null 2>&1 || true

  review:
    needs: resolve
    if: needs.resolve.outputs.resolved == 'true'
    runs-on: ${{ inputs.runs-on }}
    # Serialize auto reviews with @prowl-review commands for the same PR so pushes
    # do not cancel command side effects; stale-head checks prevent outdated
    # publishes. The resolve job runs first so fallback-resolved PRs use the same
    # PR-number key as the command workflow.
    concurrency:
      group: prowl-review-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      # Branded identity (#59): mint an App token when PROWL_APP_ID is set, so
      # comments post as <app-slug>[bot]. Read the secret via env (secrets aren't
      # available in a step `if:`) and gate the token step on the result. Fall
      # back to github-actions[bot] when unset or when token minting fails.
      - name: Detect branded app config
        id: brand
        shell: bash
        env:
          APP_ID: ${{ secrets.PROWL_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint prowl-review app token
        id: app-token
        if: steps.brand.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - name: Open Prowl Review check
        id: open-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          CHECK_RUN: ${{ inputs.check-run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CHECK_RUN}" != "true" ]; then
            exit 0
          fi
          check_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            --method POST \
            -f "name=Prowl Review" \
            -f "head_sha=${HEAD_SHA}" \
            -f "status=in_progress" \
            -f "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f "output[title]=Review in progress" \
            -f "output[summary]=Prowl Review is preparing to analyze the changes in this pull request." \
            --jq '.id' 2>/dev/null || true)"
          if [ -n "${check_run_id}" ] && [ "${check_run_id}" != "null" ]; then
            echo "check_run_id=${check_run_id}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head (context)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted base (config + guidelines)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: prowl-base
          persist-credentials: false

      - name: prowl-review
        uses: prowl-tools/prowl-code-review@v1
        env:
          # Trusted head identity re-derived from the resolved PR; the action reads
          # these for stale-head detection and same-repo (non-fork) confirmation.
          PROWL_REVIEWED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PROWL_REVIEWED_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repo }}
          PROWL_CHECK_RUN_ID: ${{ steps.open-check.outputs.check_run_id }}
        with:
          # workflow_run carries no pull_request context, so hand the resolved PR
          # number and draft state to the action explicitly (#61).
          pr-number: ${{ needs.resolve.outputs.pr_number }}
          pr-draft: ${{ needs.resolve.outputs.is_draft }}
          ai-key: ${{ secrets.PROWL_AI_KEY }}
          ai-key-anthropic: ${{ secrets.PROWL_AI_KEY_ANTHROPIC }}
          ai-key-openai: ${{ secrets.PROWL_AI_KEY_OPENAI }}
          ai-key-gemini: ${{ secrets.PROWL_AI_KEY_GEMINI }}
          ai-provider: ${{ inputs.ai-provider }}
          ai-model: ${{ inputs.ai-model }}
          min-severity: ${{ inputs.min-severity }}
          # Branded App token when configured; otherwise the default Actions token.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          bot-login: ${{ steps.app-token.outputs.app-slug != '' && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
          # Config + guidelines come from the TRUSTED base checkout, never PR code.
          config-path: ${{ inputs.config-path }}
          check-run: ${{ inputs.check-run }}
          guidelines-path: ${{ github.workspace }}/prowl-base
          org-guidelines-path: ${{ inputs.org-guidelines-path }}
          org-guidelines-workspace: ${{ inputs.org-guidelines-workspace }}
          # Context retrieval reads the PR checkout (the code under review).
          workspace-path: ${{ github.workspace }}

      - name: Complete unfinished Prowl Review check
        if: ${{ always() && steps.open-check.outputs.check_run_id != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CHECK_RUN_ID: ${{ steps.open-check.outputs.check_run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" --jq '.status' 2>/dev/null || true)"
          if [ "${status}" = "completed" ]; then
            exit 0
          fi

          title="Review workflow failed"
          summary="prowl-review could not complete because the GitHub Actions workflow failed before the review finished. Inspect this workflow run for setup, checkout, configuration, or provider errors."
          if [ "${JOB_STATUS}" = "success" ]; then
            title="Review did not complete"
            summary="prowl-review finished without completing the Prowl Review check run. Inspect this workflow run for details."
          fi

          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
            --method PATCH \
            -f "status=completed" \
            -f "conclusion=failure" \
            -f "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f "output[title]=${title}" \
            -f "output[summary]=${summary}" \
            >/dev/null 2>&1 || true
