# Example: automatic prowl-review on a SELF-HOSTED runner using the keyless
# Codex (ChatGPT subscription) provider (#45/#64). Per-review marginal cost is
# $0.00 and no provider key is stored in GitHub. Copy to
# .github/workflows/prowl-review.yml and pin `uses:` to a release.
#
# PUBLIC-REPO CAVEATS — read before using this on a public/open-source repo:
#   - OpenAI's CI/CD authentication guidance says, verbatim:
#       "Do not use this workflow for public or open-source repositories."
#   - GitHub advises against self-hosted runners on public repositories: any PR
#     can execute code on the runner. The job-level same-repo `if:` gate below
#     is REQUIRED on a public repo — it keeps fork PRs from ever being scheduled
#     onto the runner, so only your own repo's code runs there. Codex itself
#     also runs `--sandbox read-only`.
#   - Same-repo PRs are still gated by author: the resolve job below allows an
#     OWNER association or an exact login in the PROWL_REVIEW_ALLOWED_ACTORS
#     repo/org variable before the self-hosted job can be scheduled.
#   - PRIVATE repos may drop the fork gate: a private repo carries neither
#     GitHub's runner warning nor OpenAI's public-repo line, so fork-PR code
#     execution is not a concern. Keep the gate if you are unsure.
#
# The subscription login lives ONLY on the runner: run `codex login` into a
# dedicated CODEX_HOME on the host. It is never placed in GitHub Actions
# secrets, and this workflow sets no PROWL_AI_KEY*.
name: prowl-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Per-PR serialization shared with the command workflow. Keep this
# non-cancelling so a new auto-review cannot interrupt an in-flight maintainer
# command; stale auto reviews skip publishing when the reviewed head has
# advanced. Machine-wide serialization ACROSS repos/runner instances is the
# provider's Codex lock ($CODEX_HOME/.prowl-review.lock, on by default for
# `provider: codex`), NOT GitHub concurrency.
concurrency:
  group: prowl-review-codex-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write   # post the review + inline comments
  issues: write          # create/update the summary comment
  checks: write          # optional merge-gate check run
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      trusted_head: ${{ steps.pr.outputs.trusted_head }}
      approved_actor: ${{ steps.pr.outputs.approved_actor }}
    steps:
      - id: pr
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          APPROVED_ACTORS: ${{ vars.PROWL_REVIEW_ALLOWED_ACTORS || github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          is_approved_actor() {
            local login="$1"
            local association="$2"
            if [ "${association}" = "OWNER" ]; then
              return 0
            fi
            local normalized
            normalized="$(printf '%s' "${APPROVED_ACTORS:-}" | tr ',;' '  ' | tr '\n\r\t' '    ')"
            for actor in ${normalized}; do
              if [ "${login}" = "${actor}" ]; then
                return 0
              fi
            done
            return 1
          }

          if [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; then
            echo "trusted_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_head=false" >> "$GITHUB_OUTPUT"
            echo "Skipping fork PR head ${HEAD_REPO}; forks are never scheduled on the self-hosted runner."
          fi

          if is_approved_actor "${AUTHOR_LOGIN}" "${AUTHOR_ASSOCIATION}"; then
            echo "approved_actor=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved_actor=false" >> "$GITHUB_OUTPUT"
            echo "Skipping PR by @${AUTHOR_LOGIN} (${AUTHOR_ASSOCIATION:-none}); not approved for the self-hosted runner."
          fi

  review:
    needs: resolve
    # Same-repo + approved-actor gate: keeps forks and unauthorized same-repo PRs
    # off the self-hosted runner. REQUIRED on a public repo; a private repo may
    # drop the fork half only when that risk does not apply.
    if: >
      needs.resolve.outputs.trusted_head == 'true' &&
      needs.resolve.outputs.approved_actor == 'true'
    runs-on: [self-hosted, macOS, prowl-review]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Optional: load .prowl-review.yml from the TRUSTED base branch, not PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: prowl-review-config
          persist-credentials: false

      - uses: prowl-tools/prowl-code-review@v1
        with:
          # Keyless: no PROWL_AI_KEY* — auth is the runner's own `codex login`.
          ai-provider: codex
          # config-path: prowl-review-config/.prowl-review.yml  # pin model/effort here
          # min-severity: major      # optional: only surface major+ findings
