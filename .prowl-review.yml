# prowl-review dogfoods itself with the keyless Codex subscription provider (#45)
# on a self-hosted runner (#64): every PR is reviewed through the ChatGPT login
# that lives only on the Mac mini runner, so per-review marginal cost is $0.00 and
# no provider secret ever enters GitHub. Loaded by the workflows via a trusted
# base-branch `config-path` (never the PR checkout).
provider: codex                # keyless — auth is the runner's own `codex login`
model: gpt-5.5                 # ChatGPT-plan model; failback ladder gpt-5.6-terra -> gpt-5.5
codex:
  effort: low                  # low | medium | high | xhigh — cheap/fast dogfood setting
  # lock: true                 # default on: serialize codex runs machine-wide via
                               # $CODEX_HOME/.prowl-review.lock (one auth.json = one stream)

# Claude + Gemini ensemble (#53) is retired on the dogfood now that reviews run on
# the subscription-backed Codex runner (#64). Re-enable it (and restore the
# PROWL_AI_KEY_ANTHROPIC / PROWL_AI_KEY_GEMINI secrets + workflow inputs) to go
# back to API-key reviews, e.g. for a public-runner fallback:
# ensemble:
#   enabled: true
#   providers:
#     - provider: anthropic
#       model: claude-haiku-4-5
#     - provider: gemini
#       model: gemini-2.5-flash

# Fill an empty PR description from the diff (#33); never overwrites a body you wrote.
prDescription:
  enabled: true

# Validate the PR against its linked issue's acceptance criteria (#32); only acts
# when a PR links an issue (e.g. "Closes #12").
issueValidation:
  enabled: true

# Publish the review as a Checks API check run (#24) so it appears as its own
# branded "Prowl Review" row in the PR checks list (raccoon avatar via the #59
# App token), live in-progress while the review runs. Gated on `critical`: the
# row completes green (`success`) when no critical findings exist and red
# (`failure`) when one does — a visual verdict only; it never blocks a merge
# unless the check is marked Required in branch protection.
checkRun:
  enabled: true
  failOn: critical

# Survive sustained provider overload by falling back to an older same-family
# model (#17); only triggers after retries are exhausted on a retryable error.
resilience:
  failback:
    enabled: true
