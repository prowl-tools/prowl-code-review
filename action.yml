name: "prowl-review"
description: "BYOK AI code review for pull requests — multi-pass review, cross-file context, inline suggestions."
author: "Genkei Labs"
branding:
  icon: "eye"
  color: "purple"

inputs:
  ai-key:
    description: "Generic provider API key fallback (used by the primary provider when no provider-scoped key is set). Pass a secret."
    required: false
  ai-key-anthropic:
    description: "Anthropic API key (PROWL_AI_KEY_ANTHROPIC). Use for the multi-provider ensemble (#53) or as an explicit per-provider key."
    required: false
    default: ""
  ai-key-openai:
    description: "OpenAI API key (PROWL_AI_KEY_OPENAI). Use for the multi-provider ensemble (#53) or as an explicit per-provider key."
    required: false
    default: ""
  ai-key-gemini:
    description: "Gemini API key (PROWL_AI_KEY_GEMINI). Use for the multi-provider ensemble (#53) or as an explicit per-provider key."
    required: false
    default: ""
  ai-provider:
    description: "Optional LLM provider override: anthropic | openai | gemini | codex. `codex` is keyless (ChatGPT subscription via the local `codex` CLI) — pass no ai-key* inputs; self-hosted runners on non-public repositories only (#45/#64). Leave blank for the CLI default or ensemble bootstrap."
    required: false
    default: ""
  ai-model:
    description: "Optional model override (per-provider default otherwise)."
    required: false
    default: ""
  config-path:
    description: "Explicit trusted .prowl-review.yml path. Leave empty to ignore repo config in the Action."
    required: false
    default: ""
  check-run:
    description: "Publish the branded Prowl Review check run. Leave blank to use config; set true/false to override."
    required: false
    default: ""
  min-severity:
    description: "Drop findings below this severity (critical|major|minor|trivial|info)."
    required: false
    default: ""
  dry-run:
    description: "Build the review but do not publish it."
    required: false
    default: "false"
  debug:
    description: "Write a structured JSONL run trace (prompts, fetched context, findings per stage, cost) under the workspace for diagnosis (#49). Upload it with actions/upload-artifact to inspect after the run."
    required: false
    default: "false"
  workspace-path:
    description: "Repository checkout used for context lookup (defaults to GITHUB_WORKSPACE)."
    required: false
    default: ""
  guidelines-path:
    description: "Explicit trusted checkout used to load REVIEW_GUIDELINES.md/CLAUDE.md/LEARNED_PATTERNS.md for repository-level guidance; omit to disable repository guidelines (org-guidelines-path still applies)."
    required: false
    default: ""
  org-guidelines-path:
    description: "Optional trusted path to an org-wide guidelines file injected into every repo's review (added to per-repo guidelines)."
    required: false
    default: ""
  org-guidelines-workspace:
    description: "Trusted root used to validate org-guidelines-path file paths; defaults to the GitHub Actions workspace."
    required: false
    default: ""
  trust-workspace:
    description: "Allow repo-local linter/SAST tools to execute in workspace-path. Disabled automatically for fork PR events; use only for trusted checkouts."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the review (needs pull-requests: write and issues: write)."
    required: false
    default: ${{ github.token }}
  bot-login:
    description: "Login the review posts as, used to find prowl-review's own prior comment/threads/state (update-not-duplicate). Leave empty for the default Actions token; set this to your app's login when posting with a custom GitHub-App token."
    required: false
    default: ""
  mode:
    description: "What to run: 'review' (default) for a PR review, or 'command' to handle an @prowl-review comment (#26)."
    required: false
    default: "review"
  pr-number:
    description: "Explicit pull request number to review. Required when the workflow is triggered by `workflow_run` (#61) — that event carries no pull_request context, so the number must be resolved in the workflow and handed in. Leave empty to resolve from the GitHub event (pull_request triggers)."
    required: false
    default: ""
  pr-draft:
    description: "Explicit pull request draft state for `workflow_run` review runs. Leave empty to resolve from the GitHub event (pull_request triggers)."
    required: false
    default: ""

outputs:
  findings:
    description: "Number of findings produced by the review."
    value: ${{ steps.review.outputs.findings }}
  posted:
    description: "Whether the review was posted to GitHub."
    value: ${{ steps.review.outputs.posted }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "22.13.0"

    - name: Install & build prowl-review
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build

    - name: Run prowl-review
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROWL_INPUT_AI_KEY: ${{ inputs.ai-key }}
        # Provider-scoped keys for the multi-provider ensemble (#53). Export
        # these below only when non-empty, so blank inputs preserve caller env.
        PROWL_INPUT_AI_KEY_ANTHROPIC: ${{ inputs.ai-key-anthropic }}
        PROWL_INPUT_AI_KEY_OPENAI: ${{ inputs.ai-key-openai }}
        PROWL_INPUT_AI_KEY_GEMINI: ${{ inputs.ai-key-gemini }}
        PROWL_AI_PROVIDER: ${{ inputs.ai-provider }}
        PROWL_AI_MODEL: ${{ inputs.ai-model }}
        # Staged separately so PROWL_BOT_LOGIN is only exported when the input is explicit.
        PROWL_INPUT_BOT_LOGIN: ${{ inputs.bot-login }}
        # Explicit PR number for `workflow_run` review runs (#61); forwarded as --pr
        # only when set, so pull_request-triggered runs still resolve from the event.
        PROWL_INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        PROWL_REVIEWED_PR_DRAFT: ${{ inputs.pr-draft || env.PROWL_REVIEWED_PR_DRAFT }}
        PROWL_CONFIG_PATH: ${{ inputs.config-path }}
        PROWL_NO_CONFIG: ${{ inputs.config-path == '' }}
        PROWL_CHECK_RUN: ${{ inputs.check-run }}
        PROWL_CHECK_RUN_ID: ${{ env.PROWL_CHECK_RUN_ID }}
        PROWL_MIN_SEVERITY: ${{ inputs.min-severity }}
        PROWL_DRY_RUN: ${{ inputs.dry-run }}
        PROWL_DEBUG: ${{ inputs.debug }}
        PROWL_WORKSPACE: ${{ inputs.workspace-path }}
        PROWL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        PROWL_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        PROWL_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        PROWL_GUIDELINES_WORKSPACE: ${{ inputs.guidelines-path }}
        PROWL_ORG_GUIDELINES_PATH: ${{ inputs.org-guidelines-path }}
        PROWL_ORG_GUIDELINES_WORKSPACE: ${{ inputs.org-guidelines-workspace }}
        PROWL_TRUST_WORKSPACE: ${{ inputs.trust-workspace }}
        PROWL_REVIEWED_HEAD_SHA: ${{ env.PROWL_REVIEWED_HEAD_SHA || github.event.pull_request.head.sha }}
      # 'review' reviews the PR; 'command' handles an @prowl-review comment (#26).
      run: |
        if [ -n "${PROWL_INPUT_AI_KEY}" ]; then
          export PROWL_AI_KEY="${PROWL_INPUT_AI_KEY}"
        fi
        if [ -n "${PROWL_INPUT_AI_KEY_ANTHROPIC}" ]; then
          export PROWL_AI_KEY_ANTHROPIC="${PROWL_INPUT_AI_KEY_ANTHROPIC}"
        fi
        if [ -n "${PROWL_INPUT_AI_KEY_OPENAI}" ]; then
          export PROWL_AI_KEY_OPENAI="${PROWL_INPUT_AI_KEY_OPENAI}"
        fi
        if [ -n "${PROWL_INPUT_AI_KEY_GEMINI}" ]; then
          export PROWL_AI_KEY_GEMINI="${PROWL_INPUT_AI_KEY_GEMINI}"
        fi
        if [ -n "${PROWL_INPUT_BOT_LOGIN}" ]; then
          export PROWL_BOT_LOGIN="${PROWL_INPUT_BOT_LOGIN}"
        fi
        pr_args=()
        if [ -n "${PROWL_INPUT_PR_NUMBER}" ]; then
          pr_args+=(--pr "${PROWL_INPUT_PR_NUMBER}")
        fi
        node "${{ github.action_path }}/dist/cli.js" "${{ inputs.mode == 'command' && 'command' || 'review' }}" "${pr_args[@]}"
